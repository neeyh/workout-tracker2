<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rep" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Rep — Workout tracker</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap');

      :root { --ink:#1d2b26; --muted:#6d776f; --line:#dedfd8; --paper:#f6f3ee; --card:#fffdfa; --lime:#d5f24a; --orange:#ef6f42; --soft:#edf0e7; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font-family:"DM Sans",sans-serif; min-height:100vh; }
      button, input { font:inherit; }
      button { cursor:pointer; }
      .app { width:min(100%, 900px); margin:0 auto; padding:32px 24px 48px; }
      header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; }
      .eyebrow { display:flex; align-items:center; gap:8px; color:var(--muted); font:500 11px "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; margin-bottom:7px; }
      .dot { width:7px; height:7px; border-radius:50%; background:var(--orange); display:inline-block; }
      .date { text-align:right; color:var(--muted); font:500 12px "DM Mono",monospace; line-height:1.6; padding-top:3px; }
      .date strong { display:block; color:var(--ink); font-size:13px; }
      .tabs { display:flex; align-items:center; gap:7px; overflow-x:auto; padding:2px 0 12px; margin-bottom:10px; scrollbar-width:none; }
      .tabs::-webkit-scrollbar { display:none; }
      .tab { display:flex; align-items:center; gap:2px; flex:0 0 auto; border:1px solid hsl(var(--tab-hue) 45% 72%); border-radius:9px; background:hsl(var(--tab-hue) 65% 88%); padding:3px 3px 3px 10px; }
      .tab.is-active { background:hsl(var(--tab-hue) 62% 78%); border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
      .tab-name { width:84px; border:0; outline:0; background:transparent; color:var(--ink); font:500 11px "DM Mono",monospace; padding:5px 0; }
      .tab.is-active .tab-name { color:var(--ink); }
      .tab-name:focus { box-shadow:0 1px 0 var(--orange); }
      .tab-close, .add-tab { border:0; border-radius:6px; background:transparent; color:var(--muted); width:25px; height:25px; padding:0; line-height:1; font-size:17px; }
      .tab.is-active .tab-close { color:var(--ink); }
      .tab-close:hover { color:var(--orange); background:#fff0ea; }
      .add-tab { flex:0 0 auto; border:1px dashed #b8c0b4; font-size:19px; }
      .add-tab:hover { background:var(--lime); border-style:solid; border-color:var(--lime); color:var(--ink); }
      .section-title { display:flex; align-items:baseline; justify-content:space-between; margin:0 0 13px; }
      .section-title h2 { font-size:14px; margin:0; letter-spacing:-.01em; }
      .section-title span { color:var(--muted); font:11px "DM Mono",monospace; }
      #workout-list { display:grid; gap:12px; }
      .workout { background:hsl(var(--workout-hue) 62% 88%); border:1px solid hsl(var(--workout-hue) 43% 70%); border-radius:14px; overflow:hidden; transition:transform .18s ease, box-shadow .18s ease; }
      .workout:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(29,43,38,.05); }
      .workout-main { background:hsl(var(--workout-hue) 62% 91%); padding:17px 18px 14px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
      .workout-name { appearance:none; border:0; outline:0; background:transparent; color:var(--ink); font:600 20px/1.15 "Fraunces",serif; letter-spacing:-.035em; width:100%; min-width:0; padding:0; }
      .workout-name:focus { box-shadow:0 2px 0 var(--orange); }
      .name-wrap { min-width:0; flex:1; }
      .hint { color:var(--muted); display:block; font:10px "DM Mono",monospace; margin-top:7px; }
      .delete { border:0; background:transparent; padding:8px; color:var(--muted); line-height:0; border-radius:8px; transition:.15s; }
      .delete:hover { color:var(--orange); background:#fff0ea; }
      .delete svg { width:18px; height:18px; }
      .controls { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); }
      .control { min-width:0; padding:11px 13px 13px; border-right:1px solid hsl(var(--workout-hue) 35% 76%); }
      .control:nth-child(1) { background:hsl(var(--workout-hue) 62% 87%); }
      .control:nth-child(2) { background:hsl(var(--workout-hue) 62% 84%); }
      .control:nth-child(3) { background:hsl(var(--workout-hue) 62% 81%); }
      .control:last-child { border:0; }
      .control-label { display:flex; justify-content:space-between; color:var(--muted); font:500 10px "DM Mono",monospace; letter-spacing:.04em; text-transform:uppercase; margin-bottom:8px; }
      .stepper { display:grid; grid-template-columns:1fr 42px; grid-template-rows:20px 20px; align-items:center; gap:3px 4px; }
      .stepper button { width:42px; height:20px; padding:0; border:1px solid hsl(var(--workout-hue) 35% 80%); color:var(--ink); background:hsl(var(--workout-hue) 58% 99%); border-radius:6px; font-size:17px; line-height:1; transition:.15s; }
      .stepper button:hover { background:var(--soft); border-color:#bdc4b7; }
      .stepper button:first-child { grid-column:2; grid-row:2; }
      .stepper button:last-child { grid-column:2; grid-row:1; }
      .stepper input { grid-column:1; grid-row:1 / 3; min-width:0; width:100%; text-align:center; border:0; outline:0; background:transparent; color:var(--ink); font:500 16px "DM Mono",monospace; padding:5px 0; }
      .stepper input:focus { background:#f5f8ef; border-radius:6px; }
      .add { width:100%; min-height:58px; margin-top:15px; border:1px dashed #b8c0b4; border-radius:14px; background:transparent; color:var(--ink); font:600 14px "DM Sans",sans-serif; transition:.18s; }
      .add:hover { border-style:solid; background:var(--lime); border-color:var(--lime); transform:translateY(-1px); }
      .add span { font:400 18px/0 "DM Mono",monospace; vertical-align:-1px; margin-right:7px; }
      .empty { border:1px dashed #b8c0b4; border-radius:14px; padding:36px 20px; text-align:center; color:var(--muted); font-size:14px; }
      .empty strong { display:block; font:600 21px "Fraunces",serif; color:var(--ink); margin-bottom:6px; }
      .footer { color:var(--muted); text-align:center; font:10px "DM Mono",monospace; margin-top:20px; letter-spacing:.03em; }
      @media (max-width:520px) { .app { padding:23px 14px 36px; } header { margin-bottom:18px; } .tabs { margin-bottom:6px; } .tab-name { width:76px; } .workout-main { padding:15px 14px 12px; } .controls { grid-template-columns:1fr; } .control { padding:11px 7px 11px 14px; border-right:0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:65px 1fr; align-items:center; gap:12px; } .control:last-child { border-bottom:0; } .control-label { margin:0; display:block; } .stepper { grid-template-columns:1fr 48px; grid-template-rows:25px 25px; gap:3px 4px; } .stepper button { width:48px; height:25px; font-size:19px; } }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div><div class="eyebrow"><i class="dot"></i>Training log</div></div>
        <div class="date" id="date"></div>
      </header>
      <nav class="tabs" id="tabs" aria-label="Workout days"></nav>
      <div class="section-title"><h2>Workout</h2><span id="exercise-label">0 exercises</span></div>
      <section id="workout-list" aria-live="polite"></section>
      <button class="add" id="add-workout" type="button"><span>+</span>Add exercise</button>
      <p class="footer">Changes are saved automatically on this device.</p>
    </main>
    <script>
      const defaults = [
        { id: crypto.randomUUID(), name: 'Barbell back squat', weight: 70, reps: 8, sets: 3 },
        { id: crypto.randomUUID(), name: 'Romanian deadlift', weight: 55, reps: 10, sets: 3 },
        { id: crypto.randomUUID(), name: 'Walking lunge', weight: 18, reps: 12, sets: 3 }
      ];
      const savedSessions = JSON.parse(localStorage.getItem('rep-sessions') || 'null');
      const legacyWorkouts = JSON.parse(localStorage.getItem('rep-workouts') || 'null');
      let tracker = savedSessions || (() => {
        const id = crypto.randomUUID();
        return { activeId:id, sessions:[{ id, name:'Today', workouts:legacyWorkouts || defaults }] };
      })();
      const list = document.querySelector('#workout-list');
      const tabs = document.querySelector('#tabs');
      const format = new Intl.DateTimeFormat('en-US', { weekday:'long', month:'short', day:'numeric' });
      document.querySelector('#date').innerHTML = `<strong>${format.format(new Date())}</strong>${new Date().getFullYear()}`;
      const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>';
      const currentSession = () => tracker.sessions.find(session => session.id === tracker.activeId);
      const workouts = () => currentSession().workouts;
      const save = () => localStorage.setItem('rep-sessions', JSON.stringify(tracker));
      const value = (n) => Math.max(0, Number(n) || 0);
      const escapeHtml = (text) => String(text).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
      function renderTabs() {
        tabs.innerHTML = tracker.sessions.map((session, index) => `<div class="tab ${session.id === tracker.activeId ? 'is-active' : ''}" style="--tab-hue:${(index * 53 + 75) % 360}" data-tab-id="${session.id}"><input class="tab-name" aria-label="Day name" value="${escapeHtml(session.name)}"><button class="tab-close" type="button" aria-label="Delete ${escapeHtml(session.name)}" data-delete-tab>×</button></div>`).join('') + '<button class="add-tab" id="add-tab" type="button" aria-label="Add workout day">+</button>';
      }
      function render() {
        const activeWorkouts = workouts();
        renderTabs();
        list.innerHTML = activeWorkouts.length ? activeWorkouts.map((w, index) => `
          <article class="workout" style="--workout-hue:${(index * 61 + 32) % 360}" data-id="${w.id}">
            <div class="workout-main"><div class="name-wrap"><input class="workout-name" aria-label="Exercise name" value="${escapeHtml(w.name)}"><span class="hint">Tap name to edit</span></div><button class="delete" type="button" aria-label="Delete ${escapeHtml(w.name)}" data-delete>${icon}</button></div>
            <div class="controls">
              ${control('weight', 'Weight (kg)', w.weight, '', 2.5)}
              ${control('reps', 'Reps', w.reps, '', 1)}
              ${control('sets', 'Sets', w.sets, '', 1)}
            </div>
          </article>`).join('') : '<div class="empty"><strong>Ready when you are.</strong>Add an exercise to start your session.</div>';
        document.querySelector('#exercise-label').textContent = `${activeWorkouts.length} exercise${activeWorkouts.length === 1 ? '' : 's'}`;
      }
      function control(field, label, number, unit, step) {
        return `<div class="control"><label class="control-label">${label}<span>${unit}</span></label><div class="stepper"><button type="button" data-change="${field}" data-delta="-${step}" aria-label="Decrease ${label}">−</button><input type="number" inputmode="decimal" min="0" step="${step}" value="${number}" data-field="${field}" aria-label="${label}${unit ? ' in ' + unit : ''}"><button type="button" data-change="${field}" data-delta="${step}" aria-label="Increase ${label}">+</button></div></div>`;
      }
      list.addEventListener('click', e => {
        const card = e.target.closest('.workout'); if (!card) return;
        const id = card.dataset.id;
        if (e.target.closest('[data-delete]')) { currentSession().workouts = workouts().filter(w => w.id !== id); save(); render(); return; }
        const change = e.target.closest('[data-change]');
        if (change) { const w = workouts().find(x => x.id === id), key = change.dataset.change; w[key] = Math.max(0, w[key] + Number(change.dataset.delta)); save(); render(); }
      });
      list.addEventListener('change', e => {
        const card = e.target.closest('.workout'); if (!card) return;
        const w = workouts().find(x => x.id === card.dataset.id);
        if (e.target.matches('.workout-name')) w.name = e.target.value.trim() || 'Untitled exercise';
        if (e.target.matches('[data-field]')) w[e.target.dataset.field] = value(e.target.value);
        save(); render();
      });
      tabs.addEventListener('click', e => {
        if (e.target.closest('#add-tab')) {
          const id = crypto.randomUUID();
          tracker.sessions.push({ id, name:'New day', workouts:[] });
          tracker.activeId = id; save(); render();
          const input = tabs.querySelector(`[data-tab-id="${id}"] .tab-name`); input?.focus(); input?.select();
          return;
        }
        const tab = e.target.closest('[data-tab-id]'); if (!tab) return;
        const id = tab.dataset.tabId;
        if (e.target.closest('[data-delete-tab]')) {
          const session = tracker.sessions.find(item => item.id === id);
          if (!confirm(`Delete “${session.name}” and all of its workouts? This cannot be undone.`)) return;
          tracker.sessions = tracker.sessions.filter(item => item.id !== id);
          if (!tracker.sessions.length) { const newId = crypto.randomUUID(); tracker.sessions.push({ id:newId, name:'New day', workouts:[] }); }
          if (tracker.activeId === id) tracker.activeId = tracker.sessions[0].id;
          save(); render(); return;
        }
        if (!e.target.matches('.tab-name')) { tracker.activeId = id; save(); render(); }
      });
      tabs.addEventListener('change', e => {
        if (!e.target.matches('.tab-name')) return;
        const session = tracker.sessions.find(item => item.id === e.target.closest('[data-tab-id]').dataset.tabId);
        session.name = e.target.value.trim() || 'Untitled day'; save(); render();
      });
      document.querySelector('#add-workout').addEventListener('click', () => { workouts().push({ id:crypto.randomUUID(), name:'New exercise', weight:0, reps:10, sets:3 }); save(); render(); const input = list.lastElementChild?.querySelector('.workout-name'); input?.focus(); input?.select(); });
      render();
    </script>
  </body>
</html>
